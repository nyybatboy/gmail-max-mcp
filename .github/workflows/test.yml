# CI: run the unit suite (node --test) on every push/PR. The tests are hermetic:
# units over lib/, an in-memory MCP client against fake per-account Gmail clients,
# and the real bin/ entry points run in temporary directories. No Gmail creds, no network.
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
